aid: stilta
name: Stilta
description: >-
  Stilta is an agentic AI platform for high-stakes patent and intellectual
  property work, backed by a16z, NVIDIA, and Y Combinator (W26). Its agents
  automate evidence gathering and analysis across 180M+ patents, scientific
  literature, and archived web content to deliver source-cited invalidity
  analysis, infringement analysis, and freedom-to-operate assessments for
  in-house IP teams and intellectual property law firms. The platform markets
  a defensible first answer in roughly seventeen minutes, fully autonomous,
  with citations pulled from original documents. Stilta exposes a first-party
  backend API (api.stilta.com, "Patrona Patent Search Platform API") and a
  PropelAuth-based OpenID Connect identity surface at auth.stilta.com, but does
  not publish public developer documentation, an OpenAPI specification, or SDKs
  at this time. This profile was surfaced as an a16z / Y Combinator portfolio
  company and enriched from Stilta's public web surface.
